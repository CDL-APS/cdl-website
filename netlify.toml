# Configurazione Netlify.
# Il sito è statico: non c'è nulla da compilare, Netlify pubblica i file così
# come sono. Questo file serve soprattutto per i redirect e per gli header.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# REDIRECT DAI VECCHI INDIRIZZI
#
# La riorganizzazione ha spostato la scheda di dettaglio di un'opera da
# /cortoteca/info_film2 a /opera.html. I link già condivisi (Instagram, chat,
# email) devono continuare a funzionare: questi redirect li reindirizzano al
# nuovo indirizzo. Il 301 dice ai motori di ricerca che lo spostamento è
# definitivo, così l'indicizzazione si trasferisce sulla nuova pagina.
# La query string (?film=quartolivello) viene mantenuta in automatico.
# ---------------------------------------------------------------------------

# L'area socio si chiamava proponi.html (fino al 13 novembre 2026): i
# collegamenti già mandati ai soci la raggiungono. Il browser conserva la
# parte dopo il cancelletto (#invito=…) anche dopo il rimando.
[[redirects]]
  from = "/proponi.html"
  to = "/area-socio.html"
  status = 301
  force = true

[[redirects]]
  from = "/proponi"
  to = "/area-socio.html"
  status = 301
  force = true

[[redirects]]
  from = "/cortoteca/info_film2"
  to = "/opera.html"
  status = 301
  force = true

[[redirects]]
  from = "/cortoteca/info_film2.html"
  to = "/opera.html"
  status = 301
  force = true

# Vecchi percorsi delle immagini dei corti
[[redirects]]
  from = "/cortoteca/*"
  to = "/assets/img/film/:splat"
  status = 301

# Il database dei film ha cambiato nome e posizione: oggi i dati stanno su
# Supabase, data/opere.json ne è la copia di riserva
[[redirects]]
  from = "/dati_film.json"
  to = "/data/opere.json"
  status = 301

# Immagini spostate dalla radice ad assets/
[[redirects]]
  from = "/Logo.png"
  to = "/assets/img/brand/logo-cdl.png"
  status = 301

[[redirects]]
  from = "/cdl_iconaNew.png"
  to = "/assets/img/brand/icona-cdl.png"
  status = 301

[[redirects]]
  from = "/LongStoryShort.png"
  to = "/assets/img/brand/long-story-short.png"
  status = 301

[[redirects]]
  from = "/immagini/*"
  to = "/assets/img/nuvole/:splat"
  status = 301

# ---------------------------------------------------------------------------
# FILE INTERNI
#
# Netlify pubblica tutta la radice del repository. La documentazione e gli
# script del database servono a chi lavora sul sito, non devono essere
# online: a questi indirizzi si risponde "pagina non trovata" (404.html).
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/storico/*"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# HEADER
# ---------------------------------------------------------------------------

# Le immagini e i fogli di stile hanno nomi stabili: si possono tenere in cache
# a lungo nel browser di chi visita. Se un'immagine cambia contenuto ma non
# nome, va rinominata, altrimenti i visitatori abituali vedranno la vecchia.
# Per CSS e JS le pagine aggiungono una versione all'indirizzo
# (base.css?v=2026-11-12): quando li modifichi, aggiorna la data in tutte le
# pagine, così il browser scarica la versione nuova.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Il database dei film cambia spesso: cache breve, così un corto aggiunto
# oggi si vede subito.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Le due pagine con accesso (redattori e soci) eseguono solo script del sito
# e parlano solo con il progetto Supabase: se un testo arrivato dal database
# riuscisse mai a diventare codice, il browser non lo eseguirebbe e non
# potrebbe portare via la sessione. Vietano anche di essere mostrate dentro
# un'altra pagina. Chi aggiunge a queste pagine uno script, un font o
# un'immagine da un altro indirizzo deve aggiungerlo anche qui.
# Netlify serve le pagine anche senza ".html" (/gestione, /area-socio): ogni
# regola compare due volte, una per indirizzo, e le due copie vanno tenute
# uguali.
[[headers]]
  for = "/gestione.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://rsspmqhhrykbmrkmwqcg.supabase.co; connect-src 'self' https://rsspmqhhrykbmrkmwqcg.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Cache-Control = "no-store"

[[headers]]
  for = "/gestione"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://rsspmqhhrykbmrkmwqcg.supabase.co; connect-src 'self' https://rsspmqhhrykbmrkmwqcg.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Cache-Control = "no-store"

[[headers]]
  for = "/area-socio.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://rsspmqhhrykbmrkmwqcg.supabase.co; connect-src 'self' https://rsspmqhhrykbmrkmwqcg.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/area-socio"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://rsspmqhhrykbmrkmwqcg.supabase.co; connect-src 'self' https://rsspmqhhrykbmrkmwqcg.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# Protezioni di base su tutte le pagine
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

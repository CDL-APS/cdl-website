</head>
<body>

    <nav class="barra" aria-label="Navigazione principale">
        <div class="barra-gruppo">
            <span class="indicatore" aria-hidden="true"></span>

            <a href="index.html" class="voce voce--logo" aria-label="Home">
                <img src="assets/img/brand/logo-cdl.png" alt="CDL" onerror="this.replaceWith(document.createTextNode('CDL'))">
            </a>
            <a href="produzioni.html" class="voce">Produzioni</a>
            <a href="eventi.html" class="voce is-active" aria-current="page">Eventi</a>

        <a href="cortoteca.html" class="voce voce--altrove">
            <svg class="icona-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72L19 12 8 5.14Z"/></svg>
            Cortoteca
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/></svg>
        </a>
    </nav>

    <main>
        <section class="sezione sezione--prima">
            <!-- Niente titolo visibile: in testa c'è Long Story Short. Il
                 titolo resta per i lettori di schermo. -->
            <h1 class="sr-only">Eventi</h1>

            <!-- I blocchi li riempie assets/js/eventi.js dal database, in base
                 alla serie di ogni evento; un blocco senza eventi resta
                 nascosto. In primo piano l'ultima edizione di Long Story
                 Short: a sinistra la copertina con il marchio a tre righe
                 sopra, come nella pagina dell'evento; a destra titolo,
                 edizione e riassunto. -->
            <a id="primo-piano" class="primo-piano" hidden>
                <div class="primo-piano-copertina">
                    <img class="foto" alt="">
                    <img class="primo-piano-marchio" src="assets/img/brand/long-story-short.png" alt="" width="1777" height="1263">
                </div>
                <div class="primo-piano-testo">
                    <span class="freccia" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
                    </span>
                    <p class="etichetta primo-piano-edizione"></p>
                    <h2 class="primo-piano-titolo">Long Story Short</h2>
                    <p class="primo-piano-riassunto"></p>
                </div>
            </a>

            <!-- Le edizioni di Short Talks, dalla più recente -->
            <div id="blocco-short-talks" class="blocco" hidden>
                <h2 class="blocco-marchio">
                    <img src="assets/img/brand/short-talks.png" alt="Short Talks" width="1000" height="298">
                </h2>
                <div class="griglia-riquadri"></div>
            </div>

            <!-- Tutto il resto: gli eventi senza serie -->
            <div id="blocco-altri" class="blocco" hidden>
                <h2 class="titoletto titoletto--blocco">Altri eventi</h2>
                <div class="griglia-riquadri"></div>
            </div>
        </section>
    </main>

    <footer class="piede">
        <div class="piede-social">
            <a href="https://instagram.com/cdl_aps" target="_blank" rel="noopener" aria-label="Instagram" class="social-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
            </a>
            <a href="https://www.youtube.com/@cdl_aps" target="_blank" rel="noopener" aria-label="YouTube" class="social-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 2-2 69.44 69.44 0 0 1 15 0 2 2 0 0 1 2 2 24.12 24.12 0 0 1 0 10 2 2 0 0 1-2 2 69.44 69.44 0 0 1-15 0 2 2 0 0 1-2-2z"/><polyline points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg>
            </a>
            <a href="mailto:ciao@cdlaps.com" aria-label="Scrivici" class="social-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </a>
        </div>
        <div class="piede-riga">
            <img src="assets/img/brand/logo-cdl.png" alt="" class="footer-logo--dark" onerror="this.style.display='none'">
            <span>2026 CDL APS</span>
        </div>
        <p class="piede-dati">Associazione di promozione del cinema giovane e indipendente<br>
        CDL APS &bull; Viale Laurana 13, Rimini, 47921 &bull; CF: 91200080405</p>
    </footer>

    <script src="assets/js/barra.js?v=2026-10-12-3"></script>
    <script src="assets/js/dati.js?v=2026-10-12-3"></script>
    <script src="assets/js/eventi.js?v=2026-10-12-3"></script>
</body>
